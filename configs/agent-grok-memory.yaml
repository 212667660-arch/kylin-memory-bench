name: grok-memory-controller
type: memory_controller
version: "grok-4.6 via NewAPI"
base_url: https://api.wapq.cn/v1
endpoint: /chat/completions
model: grok-4.6
api_key_env: GROK_API_KEY
api_timeout_seconds: 180
action_root: ../runs/controller-actions
request_options:
  temperature: 0
description: >-
  Transparent external memory/action controller over Grok 4.6. Memory and file
  events are explicitly marked source=wrapper; model replies are source=model.
