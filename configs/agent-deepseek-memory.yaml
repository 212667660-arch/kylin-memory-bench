name: deepseek-memory-controller
type: memory_controller
version: "deepseek-v4-flash"
base_url: https://api.deepseek.com
endpoint: /chat/completions
model: deepseek-v4-flash
api_key_env: DEEPSEEK_API_KEY
api_timeout_seconds: 180
action_root: ../runs/controller-actions
request_options:
  temperature: 0
description: >-
  Transparent external memory/action controller over DeepSeek v4 flash. Memory
  and file events are explicitly marked source=wrapper; model replies are source=model.
