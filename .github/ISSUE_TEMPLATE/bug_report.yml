name: 问题反馈
description: 报告安装、评测、工作台或报告生成中的问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请提供可复现步骤和相关退出码。被测 Agent 的有效低分可能是行为结果；请说明你认为工具或评分哪里出现错误。日志请先移除 API Key、密码及其他个人信息。
  - type: input
    id: version
    attributes:
      label: 项目版本或提交
      placeholder: "例如：0.2.1、main 的提交 SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 系统版本、Python 版本、安装方式；若涉及真实 Agent，请补充 Agent 版本及套件名称。
      placeholder: "例如：openKylin 3.0 / Python 3.12 / .deb / suites/quick.yaml"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤或命令
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明退出码、运行错误或与预期不同的行为；可附脱敏日志和 score_valid 状态。
    validations:
      required: true
